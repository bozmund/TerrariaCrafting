name: Release

# Pushing a tag like v0.2.0 builds the mod and publishes it to Modrinth and to
# GitHub Releases. Nothing is published on ordinary pushes to main.
on:
  push:
    tags:
      - "v*"
  # Lets you re-run a release by hand if a publish step failed after a good build.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to publish, e.g. v0.2.0"
        required: true

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          # mc-publish reads the tag message for the changelog, and tags carry no
          # history of their own, so the full clone is needed.
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Work out the version
        id: version
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          # The mod version is the tag without its leading v: v0.2.0 -> 0.2.0
          echo "number=${TAG#v}" >> "$GITHUB_OUTPUT"

          # An annotated tag's message becomes the changelog. A lightweight tag has
          # none, so fall back to something truthful rather than an empty release.
          NOTES="$(git tag -l --format='%(contents)' "$TAG")"
          if [ -z "$(echo "$NOTES" | tr -d '[:space:]')" ]; then
            NOTES="Release $TAG. See the commit history for changes."
          fi
          {
            echo "notes<<CHANGELOG_EOF"
            echo "$NOTES"
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build
        # -Pversion overrides the placeholder in gradle.properties, so the jar and
        # the version baked into fabric.mod.json both match the tag.
        run: ./gradlew build -Pversion=${{ steps.version.outputs.number }} --no-daemon

      - name: Publish to Modrinth and GitHub
        uses: Kira-NT/mc-publish@v3.3.1
        with:
          modrinth-id: ${{ vars.MODRINTH_PROJECT_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

          # Skips the sources and dev jars that Loom also produces.
          files: build/libs/!(*-@(dev|sources|javadoc)).jar

          name: Terraria Crafting ${{ steps.version.outputs.number }}
          version: ${{ steps.version.outputs.number }}
          changelog: ${{ steps.version.outputs.notes }}

          # A tag containing a hyphen (v0.3.0-beta.1) publishes as a pre-release.
          version-type: ${{ contains(steps.version.outputs.tag, '-') && 'beta' || 'release' }}

          # Loader and game version are read from fabric.mod.json, so they stay
          # correct when the mod is ported without anyone remembering to edit this.
          dependencies: |
            fabric-api(required)
